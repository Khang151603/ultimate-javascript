       - rest: lấy tất cả phần tử còn lại
       - spread: dàn trải (liệt kê) ra các phần tử cần dùng
      */

      // const firstNameUser = user.city; // undefiend
      // const year = user.country.city.year;
      const { 
        country: {
          city: {

          }
        },
        ...rest
      } = user;
      console.log('users: ', {
        cityName,
        rest
      })

      function getInforUser({ firstName = 'John', lastName = 'Doe', age, total = 0, ...rest } = {}) {
        console.log('getInforUser: ', {

          lastName,
          age,
          total,
          rest
        })
      }

      // getInforUser({
      //   firstName: user.firstName,
      //   lastName: user.lastName,
      //   age: user.age,

      // })

      getInforUser({ ...user })

      // array desctructuring
      const animals = ['dog', 'cat', 'bear', 'tiger'];

      });
