            - DELETE: /api/users/:id -> delete user

      */

      /* apply JSON string, JSON parse

      // JSON parser
      const dataBE = JSON.parse('{"title":"foo tony","body":"bar tony","userId":1}');
      console.log('json parse: ', dataBE.title, typeof dataBE)  


      /* web storage
      -  localstorage
        - The localStorage object stores the data with no expiration date. 
        - Storage maximum 5MB.
        - Storaged from client side.
        - Data is string 
        - The data will be deleted when the user clear  history of browser.
        - Only save in its domain

        - method
          localstorage.setItem(‘key’, value) -> luu tru data vao trong storage
          localstorage.getItem(‘key’) -> lay data tu` trong storage
          localstorage.removeItem(‘key’) -> no se remove cai storage chi dinh.
          localstorage.clear() -> clear all storage.

      - session storage
        - It stores the data for only one session.
        - The data is deleted when the user closes the specific browser tab.
        - Storaged from client side.
        - Storage maximum 5MB.
        - Data is json string 
        - Only save in its domain
        - method
            sessionStorage.setItem(‘key’, value) -> luu tru data vao trong storage
            sessionStorage.getItem(‘key’) -> lay data tu` trong storage
            sessionStorage.removeItem(‘key’) -> no se remove cai storage chi dinh.
            sessionStorage.clear() -> clear all storage.
      - cookie

      - indexDB

      */
      const count = 1;
      window.sessionStorage.setItem('count', count);
      const countStorage = JSON.parse(window.sessionStorage.getItem('count'));

      console.log('compare: ', typeof countStorage, countStorage === 1); // true or false

      const product = {
        id: 1,
        name: 'iphone'
      }
       window.sessionStorage.setItem('product', JSON.stringify(product));
      const dataObjectProduct = JSON.parse(window.sessionStorage.getItem('product'));
      console.log('dataObjectProduct: ', typeof dataObjectProduct, dataObjectProduct); // true or false
