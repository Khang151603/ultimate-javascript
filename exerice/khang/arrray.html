<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
  </head>
  <body>
    Array
    <script type="text/javascript">
      /* spice - start, deleteCount, item1, item2 ... itemN
        members.splice(2) -> remove item at index 2
        members.splice(1, 0) -> nothing
        members.splice(1, 2) -> remove 2 item at index 1
        members.splice(2, 2, 'tony', 'khang') -> remove 2 item at index 2, and then insert tony, khang start at index2
      */

      // add a item into from index 1
      const members = ["truong", "sang", "linh"];
      // output: ['truong', 'quoc', 'sang', 'linh'];
      members.splice(1, 0, "quoc");
      // output: ['quoc', 'truong', 'quoc', 'sang', 'linh'];
      members.splice(0, 0, "quoc");
      // output: ['quoc', 'truong', 'quoc', 'khoa', 'sang', 'linh'];
      members.splice(3, 0, "khoa");

      // replace item
      // output: ['quoc', 'truong', 'niem', 'khoa', 'sang', 'linh'];
      members.splice(2, 1, "niem");

      // output: ['quoc', 'ngoc', 'khoa', 'sang', 'linh'];
      members.splice(1, 2, "ngoc");

      // output: ['quoc', 'kien', 'thy', 'sang', 'linh'];
      members.splice(1, 2, "kien", "thy");

      // remove item
      // output: ['quoc', 'sang', 'linh'];
      members.splice(1, 2);

      // output: ['quoc', 'sang'];
      members.splice(2, 1);

      // output: ['quoc'];
      members.splice(1);

      /* splice object
        - remove cac book price > 100
        - add new book at index 2
      */
      const books = [
        {
          id: 1,
          price: 80,
          title: "javascript",
        },
        {
          id: 2,
          price: 102,
          title: "react",
        },
        {
          id: 3,
          price: 40,
          title: "angular",
        },
      ];
      
      const newBook = {
        id: 4,
        price: 50,
        title: "vue",
      };

      const bookIndex = books.findIndex((book) => {
        return book.price > 100;
      });

      if (bookIndex !== -1) {
        books.splice(bookIndex, 1);
        books.splice(2, 0, newBook);
      }

      console.log(books);

      /* bai tap filter
        - apple -> apple
        - ap -> apple, grapes
      */
      const fruits = [
        {
          id: 1,
          title: "apple",
        },
        {
          id: 2,
          title: "banana",
        },
        {
          id: 3,
          title: "mango",
        },
        {
          id: 4,
          title: "orange",
        },
        {
          id: 5,
          title: "grapes",
        },
      ];

      const appleFruits = fruits.filter((fruit) => {
        return fruit.title === "apple";
      });
      console.log(appleFruits);

      const fruitsWithAp = fruits.filter((fruit) => {
        return fruit.title.includes("ap");
      });
      console.log(fruitsWithAp);
    </script>
  </body>
</html>
