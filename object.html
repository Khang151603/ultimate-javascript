<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
  </head>
  <body>
    Object
    <script type="text/javascript">
      // object, array, function (non-primitive) - so sánh tham chiếu 
      // define object
      const userA = {
        // properties
        firstName: 'tony', // string
        age: 18, // number
        colors: ['green', 'blue'], // array
        book: { // nested object
          title: 'one piece',
          price: 800,
        },
        city: 'VN',
        "like bird": true, // boolean

        // method
        getFullName: () => { // arrow function
          console.log('getFullName arrow: ', this)
          return 'get full name'
        },
        existedBlue: function() { // normal function
          return this.colors.some(item => item === 'blue');
        }
      }
        const userB = userA; // shallow copy

        // add new properties
        userA.lastName = 'nguyen';

        /* access properties
          object.name
          object['name']
          destructuring (es6)
        */
        const { colors } = userA;
      
        userA.getFullName();
        const resultExistedBlue = userA.existedBlue();

        console.log('object: ', {
        fistName: userA.firstName,
        age: userA['age'],
        colors, // destructuring,
        likeBirds: userA['like bird'],
        resultExistedBlue
      })
      // loop object
      for (const key in userA) {
        console.log('for ... in: ', {
          key,
          value: userA[key]
        });
      }

      // ordered
      const codes = {
        "+49": 'Germany',
        "+1": "USA",
        "+84": "VN"
      }
      for (const code in codes) {
        console.log('code: ', code, codes[code])
      }

      /* copy object
        Use the spread (...) syntax
        Use the Object.assign() method
        Use the JSON.stringify() and JSON.parse() methods
      */
      const film = {
        title: 'spiderman',
        year: 2000,
        city: 'US',
        designer: { // nested object - tham chieu
          national: "VN", 
          nickName: "John"
        }
      }
      const userV1 = {...userA, ...film}; // shadow copy/clone -> copy object, share same refer
      const userV2 = Object.assign({}, userA, film); // shadow copy/clone
      const userV3 = JSON.parse(JSON.stringify(film)) // deep copy/clone -> copy object, not share refer

      film.designer.experience = 20; 

      console.log('copy object: ', {
        userV1,
        userV2,
        userV3,
        film
      })
      /*
        user = {}
        code logic 
          -> user has value -> show UI
          -> user not value -> "Please configure..."
      */
      /* convert object to array -> person.length
        - Object.values(xx) -> [value, value ...]
        - Object.keys(xxx) -> [key, key ...]
        - Object.entries(xx)
      */

      const person = {
        firstName: 'tony',
        lastName: 'nguyen'
      }
      if (Object.keys(person).length > 0) {
        console.log('person has value')
      } else {
        console.log('person no value')
      }
      console.log('Object.keys: ', Object.keys(person))
      console.log('Object.values: ', Object.values(person))
      console.log('Object.entries: ', Object.entries(person));


      // compare object
      const hero1 = {
        name: 'spiderman',
        address: {
          ward: 14
        }
      }
      const hero2 = {
        name: 'spiderman',
        address: {
          ward: 14
        }
      }

      function shallowEqual(object1, object2) {
        const keys1 = Object.keys(object1);
        const keys2 = Object.keys(object2);

        if(keys1.length !== keys2.length) return false;

        for (const key of keys1) {
          if(object1[key] !== object2[key]) return false;
        }

        return true;
      }

      console.log('shallow equal: ', shallowEqual(hero1, hero2))

      function isObject(val) {
        return val !== null && typeof val === 'object';
      }
      function deepEqual(object1, object2) {
        const keys1 = Object.keys(object1);
        const keys2 = Object.keys(object2);

        if(keys1.length !== keys2.length) return false;

        for (const key of keys1) {
          const val1 = object1[key];
          const val2 = object2[key];
          const areObjects = isObject(val1) && isObject(val2);
          if((areObjects && !deepEqual(val1, val2)) || (!areObjects && val1 !== val2)) return false;
        }

        return true;
      }

      console.log('deepEqual equal: ', deepEqual(hero1, hero2))
    </script>
  </body>
</html>
